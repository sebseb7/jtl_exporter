name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SqlCsvExporter.slnx

      - name: Test (Release)
        run: dotnet test SqlCsvExporter.slnx -c Release --nologo

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart('v')
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$ver"

      - name: Publish Self-Contained (win-x64)
        run: >
          dotnet publish src/SqlCsvExporter/SqlCsvExporter.csproj
          -c Release
          -r win-x64
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ env.RELEASE_VERSION }}
          -o publish/selfcontained

      - name: Publish Framework-Dependent (win-x64)
        run: >
          dotnet publish src/SqlCsvExporter/SqlCsvExporter.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ env.RELEASE_VERSION }}
          -o publish/framework-dependent

      - name: Stage Artifacts & Calculate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/release-assets -Force | Out-Null
          Copy-Item publish/selfcontained/JtlMedienExporter.exe publish/release-assets/JtlMedienExporter-selfcontained-win-x64.exe
          Copy-Item publish/framework-dependent/JtlMedienExporter.exe publish/release-assets/JtlMedienExporter-framework-dependent-win-x64.exe

          $assets = Get-ChildItem -Path publish/release-assets -Filter "*.exe"

          Write-Host ""
          Write-Host "=================================================================================="
          Write-Host "                       RELEASE ARTIFACTS & SHA-256 CHECKSUMS                      "
          Write-Host "=================================================================================="

          $summary = @(
            "### 🔒 Release Artifacts & SHA-256 Checksums",
            "",
            "| Artifact | Size | SHA-256 Checksum |",
            "|---|---|---|"
          )

          foreach ($file in $assets) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            $sizeMb = [math]::Round($file.Length / 1MB, 2)

            Write-Host ("Artifact : {0}" -f $file.Name)
            Write-Host ("Size     : {0} MB ({1:N0} bytes)" -f $sizeMb, $file.Length)
            Write-Host ("SHA-256  : {0}" -f $hash)
            Write-Host "----------------------------------------------------------------------------------"

            "$hash  $($file.Name)" | Out-File -FilePath publish/release-assets/checksums.txt -Append -Encoding ascii
            $summary += "| `$($file.Name)` | $($sizeMb) MB | `$hash` |"
          }

          Write-Host "=================================================================================="
          Write-Host ""

          if ($env:GITHUB_STEP_SUMMARY) {
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $files = @(
            "publish/release-assets/JtlMedienExporter-selfcontained-win-x64.exe",
            "publish/release-assets/JtlMedienExporter-framework-dependent-win-x64.exe",
            "publish/release-assets/checksums.txt"
          )

          $viewResult = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Uploading assets..."
            gh release upload $tag @files --clobber
          } else {
            Write-Host "Creating release $tag and uploading assets..."
            gh release create $tag @files --title "$tag" --generate-notes
          }
